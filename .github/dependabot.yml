version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      radix:
        patterns: ['@radix-ui/*']
      storybook:
        patterns: ['storybook', '@storybook/*']
      testing:
        patterns:
          [
            'vitest',
            '@vitest/*',
            '@testing-library/*',
            '@playwright/test',
            'axe-core',
            '@axe-core/*',
          ]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
